income spent on housing). HAI values > 100 indicate increasing affordability; HAI values < 100 indicate areas where homes are less affordable and median income might be insufficient to purchase a median-valued home.  See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"ATRISKACSHHBPOV":{"type":"number","alias":"2024 HHs: Inc Below Poverty Level (ACS 5-Yr)","vintage":"2020-2024","source":"ACS","units":null,"decimals":null,"definition":"ACS five-year estimate of the number of Households with income Below the Poverty Level in the geographic area. Estimate and Margin of Error (MOE) from the U.S. Census American Community Survey (ACS) rolling sample 60-month survey; Esri Reliability measure designates the usability of the estimate. See <a target='_blank' href='https://links.esri.com/demographics/acs'>ACS data</a> for more information."},"KEYUSFACTSMEDVAL_CY":{"type":"number","alias":"2026 Median Home Value","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 estimate of the Median Home Value in the geographic area. Median Home Value divides home values into two equal groups; half of the homes will have a value higher than the median, and half lower. If the median is $2,000,000+, it is represented by a value of $2,000,001.  See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"HOUSINGHOUSEHOLDX3004_A":{"type":"number","alias":"2026 Avg: Mortgage/Oth Loan Pymts/Costs","vintage":"2026","source":"Esri-U.S. BLS","units":null,"decimals":null,"definition":"Esri 2026 estimates of the total (aggregate) amount spent, average amount spent per household, and Spending Potential Index (SPI) on <em>Mortgage/Other Loan Payments & Costs</em> in the geographic area. Includes expected spending on the payment of mortgage principal and interest on primary loans, home equity lines of credit (HELOC), home equity loans, as well as special lump-sum mortgage payments, special assessments, closing costs, property taxes, homeowners insurance, and ground rent. Esri’s Consumer Spending data provides information about the estimated spending by households for goods and services in an area. The aggregate value represents the total amount spent by all households. The average value represents the typical amount spent per household. The SPI compares average local expenditures to U.S. levels. The SPI value for the U.S. is 100. If, for example, the SPI value for a geographic area is 80 this implies that average spending by consumers in the geographic area is likely to be 20 percent less than the U.S. average. Sources: Esri and Bureau of Labor Statistics. See <a target='_blank' href='https://links.esri.com/demographics/consumer-spending'>Consumer Spending data</a> for more information."},"HOUSINGCOSTSACSMEDCRNT":{"type":"number","alias":"2024 Median Contract Rent (ACS 5-Yr)","vintage":"2020-2024","source":"ACS","units":null,"decimals":null,"definition":"ACS five-year estimate of the Median Contract Rent for Households Paying Cash Rent in the geographic area. Half of rented units have a higher contract rent than the median contract rent and half of rented units have a lower contract rent. Contract rent is the monthly rent agreed to or contracted for, regardless of any furnishings, utilities, fees, meals, or services that may be included. Only renter-occupied housing units paying cash rent are included. Units not paying cash rent are generally provided free by friends or relatives or in exchange for services such as resident manager, caretaker, minister, or tenant farmer; or housing on military bases. Top-coded to $3,501, meaning $3,500+.  Estimate and Margin of Error (MOE) from the U.S. Census American Community Survey (ACS) rolling sample 60-month survey; Esri Reliability measure designates the usability of the estimate See <a target='_blank' href='https://links.esri.com/demographics/acs'>ACS data</a> for more information."},"POPULATIONACSIPOV0":{"type":"number","alias":"2024 Pop Ratio Inc/Poverty: < 0.50 (ACS 5-Yr)","vintage":"2020-2024","source":"ACS","units":null,"decimals":null,"definition":"ACS five-year estimate of the Population by their Ratio of Income to Poverty: <0.50 in the geographic area. A ratio less than 1 means that income is less than the poverty level, equal to 1 means that income and poverty level are the same, and greater than 1 means that income is higher than the poverty level. Estimate and Margin of Error (MOE) from the U.S. Census American Community Survey (ACS) rolling sample 60-month survey; Esri Reliability measure designates the usability of the estimate. See <a target='_blank' href='https://links.esri.com/demographics/acs'>ACS data</a> for more information."},"POPULATIONACSIPOV050":{"type":"number","alias":"2024 Pop Ratio Inc/Poverty: 0.50-0.99 (ACS 5-Yr)","vintage":"2020-2024","source":"ACS","units":null,"decimals":null,"definition":"ACS five-year estimate of the Population by their Ratio of Income to Poverty: 0.50-0.99 in the geographic area. A ratio less than 1 means that income is less than the poverty level, equal to 1 means that income and poverty level are the same, and greater than 1 means that income is higher than the poverty level. Estimate and Margin of Error (MOE) from the U.S. Census American Community Survey (ACS) rolling sample 60-month survey; Esri Reliability measure designates the usability of the estimate. See <a target='_blank' href='https://links.esri.com/demographics/acs'>ACS data</a> for more information."},"POPULATIONACSIPOV100":{"type":"number","alias":"2024 Pop Ratio Inc/Poverty: 1.00-1.24 (ACS 5-Yr)","vintage":"2020-2024","source":"ACS","units":null,"decimals":null,"definition":"ACS five-year estimate of the Population by their Ratio of Income to Poverty: 1.00-1.24 in the geographic area. A ratio less than 1 means that s'>ACS data</a> for more information."},"POPULATIONACSIPOV185":{"type":"number","alias":"2024 Pop Ratio Inc/Poverty: 1.85-1.99 (ACS 5-Yr)","vintage":"2020-2024","source":"ACS","units":null,"decimals":null,"definition":"ACS five-year estimate of the Population by their Ratio of Income to Poverty: 1.85-1.99 in the geographic area. A ratio less than 1 means that income is less than the poverty level, equal to 1 means that income and poverty level are the same, and greater than 1 means that income is higher than the poverty level. Estimate and Margin of Error (MOE) from the U.S. Census American Community Survey (ACS) rolling sample 60-month survey; Esri Reliability measure designates the usability of the estimate. See <a target='_blank' href='https://links.esri.com/demographics/acs'>ACS data</a> for more information."},"POPULATIONACSIPOV200":{"type":"number","alias":"2024 Pop Ratio Inc/Poverty: 2.00+ (ACS 5-Yr)","vintage":"2020-2024","source":"ACS","units":null,"decimals":null,"definition":"ACS five-year estimate of the Population by their Ratio of Income to Poverty: 2.00+ in the geographic area. A ratio less than 1 means that income is less than the poverty level, equal to 1 means that income and poverty level are the same, and greater than 1 means that income is higher than the poverty level. Estimate and Margin of Error (MOE) from the U.S. Census American Community Survey (ACS) rolling sample 60-month survey; Esri Reliability measure designates the usability of the estimate. See <a target='_blank' href='https://links.esri.com/demographics/acs'>ACS data</a> for more information."},"_5YEARINCREMENTSMEDAGE_CY":{"type":"number","alias":"2026 Median Age","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 estimate of the Median Age of the population in the geographic area. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"DISPOSABLEINCOMEMEDDI_CY":{"type":"number","alias":"2026 Median Disposable Income","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 estimate of the Median Disposable Income in the geographic area. Disposable Income represents money after taxes and provides an estimate of a household's purchasing power. Four types of taxes are deducted: federal individual income taxes, state individual income taxes, FICA (Social Security) and federal retirement payroll taxes, and property taxes for owner-occupied housing. Median Disposable Income divides disposable income distribution into two equal groups; half the population has disposable income higher than the median, and half lower. If the median is $200,000+, it is represented by a value of $200,001.  See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"ATRISKTOTPOP_CY":{"type":"number","alias":"2026 Total Population","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 estimate of the Total Population in the geographic area. Total Population includes population living in households, on active duty in the Armed Forces, and living in group quarters such as correctional facilities, skilled nursing facilities, juvenile facilities, college dorms, and military barracks. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"CLOTHINGX5001_A":{"type":"number","alias":"2026 Avg: Apparel/Svcs","vintage":"2026","source":"Esri-U.S. BLS","units":null,"decimals":null,"definition":"Esri 2026 estimates of the total (aggregate) amount spent, average amount spent per household, and Spending Potential Index (SPI) on <em>Apparel & Services</em> in the geographic area. Includes expected spending on men's apparel; women's apparel; children's apparel; footwear ic variables."},"WEALTHWLTHINDXCY":{"type":"number","alias":"2026 Wealth Index","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 Wealth Index summarizes the wealth of a geographic area relative to the national level. Wealth is calculated from a number of indicators of affluence that include household income and average net worth. The concept of wealth is defined by more than just above-average household income; it also includes the value and abundance of material possessions and resources. Esri captures both aspects in its identification of the wealthiest areas in the country. The national index value is set to 100: values exceeding 100 represent above-average wealth while values below 100 represent below-average wealth. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"KEYUSFACTSDIVINDX_CY":{"type":"number","alias":"2026 Diversity Index","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 estimated Diversity Index in the geographic area. Esri's Diversity Index summarizes racial and ethnic diversity, indicating the likelihood that two individuals, chosen at random from the same area, belong to the same race or ethnic group. The index ranges from 0 (no diversity) to 100 (highest diversity). An area's Diversity Index increases when the population includes more race/ethnic groups. <a target='_blank' href='https://links.esri.com/diversity-index'>read more</a> See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"CRIMECRMCYTOTC":{"type":"number","alias":"2026 Total Crime Index","vintage":"2026","source":"AGS","units":null,"decimals":null,"definition":"The Total Crime Index provides an assessment of the relative risk of seven major crime types: murder, rape, robbery, assault, burglary, larceny, and motor vehicle theft. It is modeled using data from the FBI Uniform Crime Report and demographic data from the Census and AGS. See <a target='_blank' href='https://links.esri.com/demographics/crime-indexes'>Crime Indexes</a> for more information."},"CRIMECRMCYPERC":{"type":"number","alias":"2026 Personal Crime Index","vintage":"2026","source":"AGS","units":null,"decimals":null,"definition":"The Personal Crime Index provides an assessment of the relative risk of four major crime types: murder, rape, robbery, and assault. It is modeled using data from the FBI Uniform Crime Report and demographic data from the Census and AGS. See <a target='_blank' href='https://links.esri.com/demographics/crime-indexes'>Crime Indexes</a> for more information."},"CRIMECRMCYMURD":{"type":"number","alias":"2026 Murder Index","vintage":"2026","source":"AGS","units":null,"decimals":null,"definition":"The Murder Index provides an assessment of the relative risk of murder. It is modeled using data from the FBI Uniform Crime Report and demographic data from the Censusand AGS. Murder includes the willful killing of one human being by another.It includes murder and nonnegligent manslaughter as well as manslaughter by negligence. Deaths of persons due to their own negligence, accidental deaths not resulting from gross negligence, and traffic fatalities are not included. See <a target='_blank' href='https://links.esri.com/demographics/crime-indexes'>Crime Indexes</a> for more information."},"CRIMECRMCYRAPE":{"type":"number","alias":"2026 Rape Index","vintage":"2026","source":"AGS","units":null,"decimals":null,"definition":"The Rape Index provides an assessment of the relative risk of rape. It is modeled using data from the FBI Uniform Crime Report and demographic data from the Census and AGS. See <a target='_blank' href='https://links.esri.com/demographics/crime-indexes'>Crime Indexes</a> for more information."},"CRIMECRMCYROBB":{"type":"number","alias":"2026 Robbery Index","vintage":"2026","source":"AGS","units":null,"decimals":null,"definition":"The Robbery Index provides an assessment of the relative risk of robbery. It is modeled using data from the FBI Uniform Crime Report and demographic data from the Census and AGS. Robbery is defined as the taking or attempting to take anything of value from the care, custody, or control of a person or persons by force or threat of force or violence and/or by putting the victim in fear. See <a target='_blank' href='https://links.esri.com/demographics/crime-indexes'>Crime Indexes</a> for more information."},"CRIMECRMCYASST":{"type":"number","alias":"2026 Assault Index","vintage":"2026","source":"AGS","units":null,"decimals":null,"definition":"The Assault Index provides an assessment of the relative risk of assault. It is modeled using data from the FBI Uniform Crime Report and demographic data from the Census and AGS.An assault is and unlawful attack by one person upon another for the purpose of inflicting severe or aggravated bodily injury. This type of assault usually is accompanied by the use of a weapon or by means likely to produce death or great bodily harm. Simple assaults are excluded. See <a target='_blank' href='https://links.esri.com/demographics/crime-indexes'>Crime Indexes</a> for more information."},"CRIMECRMCYPROC":{"type":"number","alias":"2026 Property Crime Index","vintage":"2026","source":"AGS","units":null,"decimals":null,"definition":"The Property Crime Index provides an assessment of the relative risk of three major crime types: burglary, larceny, and motor vehicle theft. It is modeled using data from the FBI Uniform Crime Report and demographic data from the Census and AGS. See <a target='_blank' href='https://links.esri.com/demographics/crime-indexes'>Crime Indexes</a> for more information."},"CRIMECRMCYBURG":{"type":"number","alias":"2026 Burglary Index","vintage":"2026","source":"AGS","units":null,"decimals":null,"definition":"The Burglary Index provides an assessment of the relative risk of burglary. It is modeled using data from the FBI Uniform Crime Report and demographic data from the Census and AGS.Burglary is the unlawful entry of a structure to commit a felony or theft. Attempted forcible entry is included. See <a target='_blank' href='https://links.esri.com/demographics/crime-indexes'>Crime Indexes</a> for more information."},"CRIMECRMCYLARC":{"type":"number","alias":"2026 Larceny Index","vintage":"2026","source":"AGS","units":null,"decimals":null,"definition":"The Larceny Index provides an assessment of the relative risk of larceny and excludes motor vehicle theft. It is modeled using data from the FBI Uniform Crime Report and demographic data from the Census and AGS. Larceny is the unlawful taking, carrying, leading, or riding away of property from the possession or constructive possession of another. Examples are thefts of bicycles, motor vehicle parts and accessories, shoplifting, pocket-picking, or the stealing of any property or article that is not taken by force and violence or by fraud. Attempted larcenies are included. Embezzlement, confidence games, forgery, check fraud, etc. are excluded. See <a target='_blank' href='https://links.esri.com/demographics/crime-indexes'>Crime Indexes</a> for more information."},"CRIMECRMCYMVEH":{"type":"number","alias":"2026 Motor Vehicle Theft Index","vintage":"2026","source":"AGS","units":null,"decimals":null,"definition":"The Motor Vehicle Theft Index provides an assessment of the relative risk of motor vehicle theft. It is modeled using data from the FBI Uniform Crime Report and demographic data from the Census and AGS. It includes the theft or attempted theft of a motor vehicle. A motor vehicle is self-propelled and runs on land surface and not on rails. Motorboats, construction equipment, airplanes, and farming equipment are specifically excluded from this category. See <a target='_blank' href='https://links.esri.com/demographics/crime-indexes'>Crime Indexes</a> for more info ocabulary</a>. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"HOMEVALUEMEDVAL_CY":{"type":"number","alias":"2026 Median Home Value","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 estimate of the Median Home Value in the geographic area. Median Home Value divides home values into two equal groups; half of the homes will have a value higher than the median, and half lower. If the median is $2,000,000+, it is represented by a value of $2,000,001.  See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"_5YEARINCREMENTSMEDAGE_CY":{"type":"number","alias":"2026 Median Age","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 estimate of the Median Age of the population in the geographic area. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"KEYUSFACTSDIVINDX_CY":{"type":"number","alias":"2026 Diversity Index","vintage":"2026","source":"Esri","units":null,"decimals":null,"definition":"Esri 2026 estimated Diversity Index in the geographic area. Esri's Diversity Index summarizes racial and ethnic diversity, indicating the likelihood that two individuals, chosen at random from the same area, belong to the same race or ethnic group. The index ranges from 0 (no diversity) to 100 (highest diversity). An area's Diversity Index increases when the population includes more race/ethnic groups. <a target='_blank' href='https://links.esri.com/diversity-index'>read more</a> See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."}},"comparison_7":{"STORE_ID":{"type": American Community Survey (ACS) rolling sample 60-month survey; Esri Reliability measure designates the usability of the estimate. See <a target='_blank' href='https://links.esri.com/demographics/acs'>ACS data</a> for more information."},"dataCollectionsCalculator.KEYUSFACTSMEDVAL_CY":{"id":"MEDVAL_CY","fullName":"KeyUSFacts.MEDVAL_CY","alias":"2026 Median Home Value","fieldName":"KEYUSFACTSMEDVAL_CY","precision":0,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.KEYUSFACTSMEDVAL_CY","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri","definition":"Esri 2026 estimate of the Median Home Value in the geographic area. Median Home Value divides home values into two equal groups; half of the homes will have a value higher than the median, and half lower. If the median is $2,000,000+, it is represented by a value of $2,000,001.  See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"dataCollectionsCalculator.HOUSINGHOUSEHOLDX3004_A":{"id":"X3004_A","fullName":"HousingHousehold.X3004_A","alias":"2026 Avg: Mortgage/Oth Loan Pymts/Costs","fieldName":"HOUSINGHOUSEHOLDX3004_A","precision":0,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.HOUSINGHOUSEHOLDX3004_A","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri-U.S. BLS","definition":"Esri 2026 estimates of the total (aggregate) amount spent, average amount spent per household, and Spending Potential Index (SPI) on <em>Mortgage/Other Loan Payments & Costs</em> in the geographic area. Includes expected spending on the payment of mortgage principal and interest on primary loans, home equity lines of credit (HELOC), home equity loans, as well as special lump-sum mortgage payments, special assessments, closing costs, property taxes, homeowners insurance, and ground rent. Esri’s Consumer Spending data provides information about the estimated spending by households for goods and services in an area. The aggregate value represents the total amount spent by all households. The average value represents the typical amount spent per household. The SPI compares average local expenditures to U.S. levels. The SPI value for the U.S. is 100. If, for example, the SPI value for a geographic area is 80 this implies that average spending by consumers in the geographic area is likely to be 20 percent less than the U.S. average. Sources: Esri and Bureau of Labor Statistics. See <a target='_blank' href='https://links.esri.com/demographics/consumer-spending'>Consumer Spending data</a> for more information."},"dataCollectionsCalculator.HOUSINGCOSTSACSMEDCRNT":{"id":"ACSMEDCRNT","fullName":"housingcosts.ACSMEDCRNT","alias":"2024 Median Contract Rent (ACS 5-Yr)","fieldName":"HOUSINGCOSTSACSMEDCRNT","precision":0,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.HOUSINGCOSTSACSMEDCRNT","type":"esriFieldTypeDouble","vintage":"2020-2024","source":"ACS","definition":"ACS five-year estimate of the Median Contract Rent for Households Paying Cash Rent in the geographic area. Half of rented units have a higher contract rent than the median contract rent and half of rented units have a lower contract rent. Contract rent is the monthly rent agreed to or contracted for, regardless of any furnishings, utilities, fees, meals, or services that may be included. Only renter-occupied housing units paying cash rent are included. Units not paying cash rent are generally provided free by friends or relatives or in exchange for services such as resident manager, caretaker, minister, or tenant farmer; or housing on military bases. Top-coded to $3,501, meaning $3,500+.  Estimate and Margin of Error (MOE) from the U.S. Census American Community Survey (ACS) rolling sample 60-month survey; Esri Reliability measure designates the usability of the estimate See <a target='_blank' href='https://links.esri.com/demographics/acs'>ACS data</a> for more information."},"dataCollectionsCalculator.POPULATIONACSIPOV0":{"id":"ACSIPOV0","fullName":"population.ACSIPOV0","alias":"2024 Pop Ratio Inc/Poverty: < 0.50 (ACS 5-Yr)","fieldName":"POPULATIONACSIPOV0","precision":0,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.POPULATIONACSIPOV0","type":"esriFieldTypeDouble","vintage":"2020-2024","source":"ACS","definition":"ACS five-year estimate of the Population by their Ratio of Income to Poverty: <0.50 in the geographic area. A ratio less than 1 means that income is less than the poverty level, equal to 1 means that income and poverty level are the same, and greater than 1 means that income is higher than the poverty level. Estimate and Margin of Error (MOE) from the U.S. Census American Community Survey (ACS) rolling sample 60-month survey; Esri Reliability measure designates the usability of the estimate. See <a target='_blank' href='https://links.esri.com/demographics/acs'>ACS data</a> for more information."},"dataCollectionsCalculator.POPULATIONACSIPOV050":{"id":"ACSIPOV050","fullName":"population.ACSIPOV050","alias":"2024 Pop Ratio Inc/Poverty: 0.50-0.99 (ACS 5-Yr)","fieldName":"POPULATIONACSIPOV050","precision":0,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.POPULATIONACSIPOV050","type":"esriFieldTypeDouble","vintage":"2020-2024","source":"ACS","definition":"ACS five-year estimate of the Population by their Ratio of Income to Poverty: 0.50-0.99 in the geographic area. A ratio less than 1 means that income is less than the poverty level, equal to 1 means that income and poverty level are the same, and greater than 1 means that income is higher than the poverty level. Estimate and Margin of Error (MOE) from the U.S. Census American Community Survey (ACS) rolling sample 60-month survey; Esri Reliability measure designates the usability of the estimate. See <a target='_blank' href='https://links. Calculator.DISPOSABLEINCOMEMEDDI_CY","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri","definition":"Esri 2026 estimate of the Median Disposable Income in the geographic area. Disposable Income represents money after taxes and provides an estimate of a household's purchasing power. Four types of taxes are deducted: federal individual income taxes, state individual income taxes, FICA (Social Security) and federal retirement payroll taxes, and property taxes for owner-occupied housing. Median Disposable Income divides disposable income distribution into two equal groups; half the population has disposable income higher than the median, and half lower. If the median is $200,000+, it is represented by a value of $200,001.  See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"dataCollectionsCalculator.ATRISKTOTPOP_CY":{"id":"TOTPOP_CY","fullName":"AtRisk.TOTPOP_CY","alias":"2026 Total Population","fieldName":"ATRISKTOTPOP_CY","precision":0,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.ATRISKTOTPOP_CY","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri","definition":"Esri 2026 estimate of the Total Population in the geographic area. Total Population includes population living in households, on active duty in the Armed Forces, and living in group quarters such as correctional facilities, skilled nursing facilities, juvenile facilities, college dorms, and military barracks. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"dataCollectionsCalculator.CLOTHINGX5001_A":{"id":"X5001_A","fullName":"clothing.X5001_A","alias":"2026 Avg: Apparel/Svcs","fieldName":"CLOTHINGX5001_A","precision":0,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.CLOTHINGX5001_A","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri-U.S. BLS","definition":"Esri 2026 estimates of the total (aggregate) amount spent, average amount spent per household, and Spending Potential Index (SPI) on <em>Apparel & Services</em> in the geographic area. Includes expected spending on men's apparel; women's apparel; children's apparel; footwear; apparel products and services; and watches and jewelry. Esri’s Consumer Spending data provides information about the estimated spending by households for goods and services in an area. The aggregate value represents the total amount spent by all households. The average value represents the typical amount spent per household. The SPI compares average local expenditures to U.S. levels. The SPI value for the U.S. is 100. If, for example, the SPI value for a geographic area is 80 this implies that average spending by consumers in the geographic area is likely to be 20 percent less than the U.S. average. Sources: Esri and Bureau of Labor Statistics. See <a target='_blank' href='https://links.esri.com/demographics/consumer-spending'>Consumer Spending data</a> for more information."},"dataCollectionsCalculator.HOUSINGHOUSEHOLDX4100_A":{"id":"X4100_A","fullName":"HousingHousehold.X4100_A","alias":"2026 Avg: Computers/Hardware-Home Use","fieldName":"HOUSINGHOUSEHOLDX4100_A","precision":0,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.HOUSINGHOUSEHOLDX4100_A","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri-U.S. BLS","definition":"Esri 2026 estimates of the total (aggregate) amount spent, average amount spent per household, and Spending Potential Index (SPI) on <em>Computers & Hardware for Home Use</em> in the geographic area. Esri’s Consumer Spending data provides information about the estimated spending by households for goods and services in an area. The aggregate value represents the total amount spent by all households. The average value represents the typical amount spent per household. The SPI compares average local expenditures to U.S. levels. The SPI value for the U.S. is 100. If, for example, the SPI value for a geographic area is 80 this implies that average spending by consumers in the geographic area is likely to be 20 percent less than the U.S. average. Sources: Esri and Bureau of Labor Statistics. See <a target='_blank' href='https://links.esri.com/demographics/consumer-spending'>Consumer Spending data</a> for more information."},"dataCollectionsCalculator.FOODX1130_A":{"id":"X1130_A","fullName":"food.X1130_A","alias":"2026 Avg: Food Away from Home","fieldName":"FOODX1130_A","precision":0,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.FOODX1130_A","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri-U.S. BLS","definition":"Esri 2026 estimates of the total (aggregate) amount spent, average amount spent per household, and Spending Potential Index (SPI) on <em>Food Away from Home</em> in the geographic area. Includes expected spending on food and nonalcoholic beverages at restaurants/other; catered events; and school meals and board. Esri’s Consumer Spending data provides information about the estimated spending by households for goods and services in an area. The aggregate value represents the total amount spent by all households. The average value represents the typical amount spent per household. The SPI compares average local expenditures to U.S. levels. The SPI value for the U.S. is 100. If, for example, the SPI value for a geographic area is 80 this implies that average spending by consumers in the geographic area is likely to be 20 percent less than the U.S. average. Sources: Esri and Bureau of Labor Statistics. See <a target='_blank' href='https://links.esri.com/demographics/consumer-spending'>Consumer Spending data</a> for more information."},"dataCollectionsCalculator.FOODX1003_A":{"id":"X1003_A","fullName":"food.X1003_A","alias":"2026 Avg: Food at Home","fieldName":"FOODX1003_A","precision":0,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.FOODX1003_A","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri-U.S. BLS","definition":"Esri 2026 estimates of the total (aggregate) amount spent, average amount spent per household, and Spending Potential Index (SPI) on <em>Food at Home</em> in the geographic area. Includes expected spending on bakery and cereal products; meat, poultry, fish, and eggs; dairy products; fruit and vegetables; snacks/other food; and nonalcoholic beverages. Esri’s Consumer Spending data provides information about the estimated spending by households for goods and services in an area. The aggregate value represents the total amount spent by all households. The average value represents the typical amount spent per household. The SPI compares average local expenditures to U.S. levels. The SPI value for the U.S. is 100. If, for example, the SPI value for a geographic area is 80 this implies that average spending by consumers in the geographic area is likely to be 20 percent less than the U.S. average. Sources: Esri and Bureau of Labor Statistics. See <a target='_blank' href='https://links.esri.com/demographics/consumer-spending'>Consumer Spending data</a> for more information."},"dataCollectionsCalculator.HEALTHPERSONALCARECEXX8001_A":{"id":"X8001_A","fullName":"HealthPersonalCareCEX.X8001_A","alias":"2026 Avg: Health Care","fieldName":"HEALTHPERSONALCARECEXX8001_A","precision":0,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.HEALTHPERSONALCARECEXX8001_A","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri-U.S. BLS","definition":"Esri 2026 estimates of the total (aggregate) amount spent, average amount spent per household, and Spending Potential Index (SPI) on <em>Health Care</em> in the geographic area. Includes expected spending on health insurance and medical care. Esri’s Consumer Spending data provides information about the estimated spending by households for goods and services in an area. The aggregate value represents the total amount spent by all households. The average value represents the typical amount spent per household. The SPI compares average local expenditures to U.S. levels. The SPI value for the U.S. is 100. If, for example, the SPI value for a geographic area is 80 this implies that average spending by consumers in the geographic area is likely to be 20 percent less than the U.S. average. Sources: Esri and Bureau of Labor Statistics. See <a target='_blank' href='https://links.esri.com/demographics/consumer-spending'>Consumer Spending data</a> for more information."},"dataCollectionsCalculator.GENERATIONSGENALPHACY_P":{"id":"GENALPHACY_P","fullName":"Generations.GENALPHACY_P","alias":"2026 Generation Alpha Pop: Percent","fieldName":"GENERATIONSGENALPHACY_P","precision":2,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.GENERATIONSGENALPHACY_P","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri","definition":"Esri 2026 estimate of the Generation Alpha Population (Born 2017 or Later) in the geographic area. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"dataCollectionsCalculator.GENERATIONSGENZ_CY_P":{"id":"GENZ_CY_P","fullName":"Generations.GENZ_CY_P","alias":"2026 Generation Z Pop: Percent","fieldName":"GENERATIONSGENZ_CY_P","precision":2,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.GENERATIONSGENZ_CY_P","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri","definition":"Esri 2026 estimate of the Generation Z Population (Born 1999-2016) in the geographic area. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"dataCollectionsCalculator.GENERATIONSMILLENN_CY_P":{"id":"MILLENN_CY_P","fullName":"Generations.MILLENN_CY_P","alias":"2026 Millennial Pop: Percent","fieldName":"GENERATIONSMILLENN_CY_P","precision":2,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.GENERATIONSMILLENN_CY_P","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri","definition":"Esri 2026 estimate of the Millennial Population (Born 1981-1998) in the geographic area. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"dataCollectionsCalculator.GENERATIONSGENX_CY_P":{"id":"GENX_CY_P","fullName":"Generations.GENX_CY_P","alias":"2026 Generation X Pop: Percent","fieldName":"GENERATIONSGENX_CY_P","precision":2,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.GENERATIONSGENX_CY_P","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri","definition":"Esri 2026 estimate of the Generation X Population (Born 1965-1980) in the geographic area. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"dataCollectionsCalculator.GENERATIONSBABYBOOMCY_P":{"id":"BABYBOOMCY_P","fullName":"Generations.BABYBOOMCY_P","alias":"2026 Baby Boomer Pop: Percent","fieldName":"GENERATIONSBABYBOOMCY_P","precision":2,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.GENERATIONSBABYBOOMCY_P","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri","definition":"Esri 2026 estimate of the Baby Boomer Population (Born 1946-1964) in the geographic area. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"dataCollectionsCalculator.GENERATIONSOLDRGENSCY_P":{"id":"OLDRGENSCY_P","fullName":"Generations.OLDRGENSCY_P","alias":"2026 Silent & Greatest Generations Pop: Percent","fieldName":"GENERATIONSOLDRGENSCY_P","precision":2,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.GENERATIONSOLDRGENSCY_P","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri","definition":"Esri 2026 estimate of the Silent & Greatest Generations Population (Born 1945 or earlier) in the geographic area. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"dataCollectionsCalculator.WEALTHWLTHINDXCY":{"id":"WLTHINDXCY","fullName":"Wealth.WLTHINDXCY","alias":"2026 Wealth Index","fieldName":"WEALTHWLTHINDXCY","precision":0,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.WEALTHWLTHINDXCY","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri","definition":"Esri 2026 Wealth Index summarizes the wealth of a geographic area relative to the national level. Wealth is calculated from a number of indicators of affluence that include household income and average net worth. The concept of wealth is defined by more than just above-average household income; it also includes the value and abundance of material possessions and resources. Esri captures both aspects in its identification of the wealthiest areas in the country. The national index value is set to 100: values exceeding 100 represent above-average wealth while values below 100 represent below-average wealth. See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"dataCollectionsCalculator.KEYUSFACTSDIVINDX_CY":{"id":"DIVINDX_CY","fullName":"KeyUSFacts.DIVINDX_CY","alias":"2026 Diversity Index","fieldName":"KEYUSFACTSDIVINDX_CY","precision":0,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.KEYUSFACTSDIVINDX_CY","type":"esriFieldTypeDouble","vintage":"2026","source":"Esri","definition":"Esri 2026 estimated Diversity Index in the geographic area. Esri's Diversity Index summarizes racial and ethnic diversity, indicating the likelihood that two individuals, chosen at random from the same area, belong to the same race or ethnic group. The index ranges from 0 (no diversity) to 100 (highest diversity). An area's Diversity Index increases when the population includes more race/ethnic groups. <a target='_blank' href='https://links.esri.com/diversity-index'>read more</a> See <a target='_blank' href='https://links.esri.com/demographics/updated-demographics'>Updated Demographics</a> for more information on Esri Demographic variables."},"dataCollectionsCalculator.CRIMECRMCYTOTC":{"id":"CRMCYTOTC","fullName":"crime.CRMCYTOTC","alias":"2026 Total Crime Index","fieldName":"CRIMECRMCYTOTC","precision":0,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.CRIMECRMCYTOTC","type":"esriFieldTypeDouble","vintage":"2026","source":"AGS","definition":"The Total Crime Index provides an assessment of the relative risk of seven major crime types: murder, rape, robbery, assault, burglary, larceny, and motor vehicle theft. It is modeled using data from the FBI Uniform Crime Report and demographic data from the Census and AGS. See <a target='_blank' href='https://links.esri.com/demographics/crime-indexes'>Crime Indexes</a> for more information."},"dataCollectionsCalculator.CRIMECRMCYPERC":{"id":"CRMCYPERC","fullName":"crime.CRMCYPERC","alias":"2026 Personal Crime Index","fieldName":"CRIMECRMCYPERC","precision":0,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.CRIMECRMCYPERC","type":"esriFieldTypeDouble","vintage":"2026","source":"AGS","definition":"The Personal Crime Index provides an assessment of the relative risk of four major crime types: murder, rape, robbery, and assault. It is modeled using data from the FBI Uniform Crime Report and demographic data from the Census and AGS. See <a target='_blank' href='https://links.esri.com/demographics/crime-indexes'>Crime Indexes</a> for more information."},"dataCollectionsCalculator.CRIMECRMCYMURD":{"id":"CRMCYMURD","fullName":"crime.CRMCYMURD","alias":"2026 Murder Index","fieldName":"CRIMECRMCYMURD","precision":0,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.CRIMECRMCYMURD","type":"esriFieldTypeDouble","vintage":"2026","source":"AGS","definition":"The Murder Index provides an assessment of the relative risk of murder. It is modeled using data from the FBI Uniform Crime Report and demographic data from the Censusand AGS. Murder includes the willful killing of one human being by another.It includes murder and nonnegligent manslaughter as well as manslaughter by negligence. Deaths of persons due to their own negligence, accidental deaths not resulting from gross negligence, and traffic fatalities are not included. See <a target='_blank' href='https://links.esri.com/demographics/crime-indexes'>Crime Indexes</a> for more information."},"dataCollectionsCalculator.CRIMECRMCYRAPE":{"id":"CRMCYRAPE","fullName":"crime.CRMCYRAPE","alias":"2026 Rape Index","fieldName":"CRIMECRMCYRAPE","precision":0,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.CRIMECRMCYRAPE","type":"esriFieldTypeDouble","vintage":"2026","source":"AGS","definition":"The Rape Index provides an assessment of the relative risk of rape. It is modeled using data from the FBI Uniform Crime Report and demographic data from the Census and AGS. See <a target='_blank' href='https://links.esri.com/demographics/crime-indexes'>Crime Indexes</a> for more information."},"dataCollectionsCalculator.CRIMECRMCYROBB":{"id":"CRMCYROBB","fullName":"crime.CRMCYROBB","alias":"2026 Robbery Index","fieldName":"CRIMECRMCYROBB","precision":0,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.CRIMECRMCYROBB","type":"esriFieldTypeDouble","vintage":"2026","source":"AGS","definition":"The Robbery Index provides an assessment of the relative risk of robbery. It is modeled using data from the FBI Uniform Crime Report and demographic data from the Census and AGS. Robbery is defined as the taking or attempting to take anything of value from the care, custody, or control of a person or persons by force or threat of force or violence and/or by putting the victim in fear. See <a target='_blank' href='https://links.esri.com/demographics/crime-indexes'>Crime Indexes</a> for more information."},"dataCollectionsCalculator.CRIMECRMCYASST":{"id":"CRMCYASST","fullName":"crime.CRMCYASST","alias":"2026 Assault Index","fieldName":"CRIMECRMCYASST","precision":0,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.CRIMECRMCYASST","type":"esriFieldTypeDouble","vintage":"2026","source":"AGS","definition":"The Assault Index provides an assessment of the relative risk of assault. It is modeled using data from the FBI Uniform Crime Report and demographic data from the Census and AGS.An assault is and unlawful attack by one person upon another for the purpose of inflicting severe or aggravated bodily injury. This type of assault usually is accompanied by the use of a weapon or by means likely to produce death or great bodily harm. Simple assaults are excluded. See <a target='_blank' href='https://links.esri.com/demographics/crime-indexes'>Crime Indexes</a> for more information."},"dataCollectionsCalculator.CRIMECRMCYPROC":{"id":"CRMCYPROC","fullName":"crime.CRMCYPROC","alias":"2026 Property Crime Index","fieldName":"CRIMECRMCYPROC","precision":0,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.CRIMECRMCYPROC","type":"esriFieldTypeDouble","vintage":"2026","source":"AGS","definition":"The Property Crime Index provides an assessment of the relative risk of three major crime types: burglary, larceny, and motor vehicle theft. It is modeled using data from the FBI Uniform Crime Report and demographic data from the Census and AGS. See <a target='_blank' href='https://links.esri.com/demographics/crime-indexes'>Crime Indexes</a> for more information."},"dataCollectionsCalculator.CRIMECRMCYBURG":{"id":"CRMCYBURG","fullName":"crime.CRMCYBURG","alias":"2026 Burglary Index","fieldName":"CRIMECRMCYBURG","precision":0,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.CRIMECRMCYBURG","type":"esriFieldTypeDouble","vintage":"2026","source":"AGS","definition":"The Burglary Index provides an assessment of the relative risk of burglary. It is modeled using data from the FBI Uniform Crime Report and demographic data from the Census and AGS.Burglary is the unlawful entry of a structure to commit a felony or theft. Attempted forcible entry is included. See <a target='_blank' href='https://links.esri.com/demographics/crime-indexes'>Crime Indexes</a> for more information."},"dataCollectionsCalculator.CRIMECRMCYLARC":{"id":"CRMCYLARC","fullName":"crime.CRMCYLARC","alias":"2026 Larceny Index","fieldName":"CRIMECRMCYLARC","precision":0,"calculatorName":"dataCollectionsCalculator","templateName":"dataCollectionsCalculator.CRIMECRMCYLARC","type":"esriFieldTypeDouble","vintage":"2026","source":"AGS","definition":"The Larceny Index provides an assessment of the relative risk of larceny and excludes motor vehicle theft. It is modeled using data from the FBI Uniform Crime Report and demographic data from the Census and AGS. Larceny is the unlawful taking, carrying, leading, or riding away of property from the possession or constructive possession of another. Examples are thefts of bicycles, motor vehicle parts and accessories, shoplifting, pocket-picking, or the stealing of any property or article that is not taken by force and violence or by fraud. Attempted larcenies are included. Embezzlement, confidence games, forgery, check fraud, etc. are excluded. See <a ta
